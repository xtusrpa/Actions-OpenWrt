name: iStoreOS 固件编译流水线

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'true'
        type: boolean

# 赋予完整权限
permissions:
  contents: write
  actions: write

env:
  REPO_URL: https://github.com/istoreos/istoreos
  REPO_BRANCH: istoreos-24.10
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: istoreos.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-istoreos.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:

    # 1. 检出当前仓库代码
    - name: Checkout
      uses: actions/checkout@v4

    # 2. 清理磁盘空间，防止编译时空间不足
    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: false   # <--- 【修正处 1】改为 false，保留系统原生的 4G Swap 缓冲垫

    # 3. 初始化编译环境，安装所有依赖工具
    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    # 4. 克隆 iStoreOS 官方源码
    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    # =================================================================
    # 4.5 强行植入 OpenClash 源码（卡在拉取源码后，更新 feeds 前）
    # =================================================================
    - name: Add OpenClash source
      run: |
        cd openwrt
        git clone --depth=1 -b master https://github.com/vernesong/OpenClash.git package/luci-app-openclash

    # 5. 加载自定义 feeds 配置并执行 diy-part1.sh
    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    # 6. 更新所有 feeds 源
    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    # 7. 删除可能导致冲突的 mosdns 和 v2dat 插件
    - name: Remove mosdns and v2dat
      run: |
        cd openwrt
        rm -rf feeds/packages/net/mosdns
        rm -rf feeds/packages/net/v2dat
        rm -rf feeds/luci/applications/luci-app-mosdns

    # 8. 升级 Go 语言版本到 1.24.x
    - name: Upgrade Go to 1.24.x
      run: |
        cd openwrt
        rm -rf feeds/packages/lang/golang
        git clone https://github.com/sbwml/packages_lang_golang -b 24.x feeds/packages/lang/golang

    # 9. 安装 feeds 中的所有软件包
    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    # 10. 加载自定义配置并执行 diy-istoreos.sh
    - name: Load custom configuration
      run: |
        # 移动自定义 files 文件夹和配置文件
        [ -e files ] && mv files openwrt/files || true
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config || true
        
        chmod +x $DIY_P2_SH
        cd openwrt
        
        # 执行自定义脚本
        $GITHUB_WORKSPACE/$DIY_P2_SH || echo "⚠️ diy-istoreos.sh 执行有警告"
        
        echo "✅ diy-istoreos.sh 执行完成"
        
        # 强制清理残留配置
        sed -i 's/CONFIG_PACKAGE_mosdns=y/# CONFIG_PACKAGE_mosdns is not set/g' .config || true
        sed -i 's/CONFIG_PACKAGE_v2dat=y/# CONFIG_PACKAGE_v2dat is not set/g' .config || true
        sed -i 's/CONFIG_PACKAGE_luci-app-mosdns=y/# CONFIG_PACKAGE_luci-app-mosdns is not set/g' .config || true
        
        # 重新生成配置
        make defconfig

    # 11. 开启 SSH 调试通道（可选）
    - name: SSH connection to Actions
      uses: mxschmitt/action-tmate@v3
      if: (github.event.inputs.ssh == 'true' && github.event.inputs.ssh != 'false') || contains(github.event.action, 'ssh')

    # 12. 下载编译所需的源代码包
    - name: Download package
      id: package
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    # 12.5 临时扩充超级虚拟内存，防止 Node.js 暴毙
    # <--- 【修正处 2】新增步骤：叠加系统原生4G，编译机此时拥有整整 12GB Swap 兜底
    - name: Allocate 8G Swap space
      run: |
        sudo fallocate -l 8G /swapfile
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile
        free -h

    # 13. 编译固件（核心编译步骤）
    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        # <--- 【修正处 3】去除中间死锁的 make -j1，一旦报错立刻单线程+全日志大声呼救
        make -j$(nproc) || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    # 14. 检查磁盘空间使用情况
    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    # 15. 上传 bin 目录（可选）
    - name: Upload bin directory
      uses: actions/upload-artifact@v4
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: iStoreOS_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    # 16. 整理固件文件
    - name: Organize files
      id: organize
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    # 17. 上传固件到 Actions 附件
    - name: Upload firmware directory
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: iStoreOS_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    # 18. 生成 Release Tag
    - name: Generate release tag
      id: tag
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo "release_tag=iStoreOS-$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        touch release.txt
        echo "status=success" >> $GITHUB_OUTPUT

    # 19. 发布固件到 GitHub Releases
    - name: Upload firmware to release
      uses: softprops/action-gh-release@v2
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*

    # 20. 发送 Telegram 编译成功通知
    - name: 发送 Telegram 编译成功通知
      if: success()
      run: |
        MSG="🅱️ 恭喜主人！iStoreOS 固件最新版编译完成！🎉%0A%0A⏰ 编译时间：$(date +'%Y-%m-%d %H:%M:%S')%0A🌐 日志与固件下载：https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        
        curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          -H "Content-Type: application/x-www-form-urlencoded" \
          --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
          --data-urlencode "text=${MSG}"
