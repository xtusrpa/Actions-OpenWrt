#
# https://github.com/P3TERX/Actions-OpenWrt
#
# 文件名: .github/workflows/openwrt-builder.yml
# 描述: 使用 GitHub Actions 编译 OpenWrt/ImmortalWrt
#

name: 天灵 ImmortalWrt 编译流水线

on:
  # 允许外部通过 API 触发此工作流
  repository_dispatch:
  # 允许在 GitHub 网页端手动点击运行
  workflow_dispatch:
    inputs:
      ssh:
        description: '是否开启 SSH 连接以便进行调试'
        required: false
        default: 'true'
        type: boolean

# 【核心修复 1】显式赋予流水线完整的写入权限，确保后续清理旧 Release、旧运行记录和 Git Tags 时不会触发 403 错误
permissions:
  contents: write
  actions: write

# 定义全局环境变量
env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt # 目标源码仓库地址
  REPO_BRANCH: mastr                           # 目标分支（x86 追求稳定可改为 openwrt-23.05）
  FEEDS_CONF: feeds.conf.default                       # 默认的软件源配置文件名
  CONFIG_FILE: immortalwrt.config                      # 你的自定义 .config 配置文件名
  DIY_P1_SH: diy-part1.sh                              # 更新 feeds 前执行的自定义脚本
  DIY_P2_SH: diy-immortalwrt.sh                        # 更新 feeds 后执行的自定义脚本
  UPLOAD_BIN_DIR: false                                # 是否上传 bin 目录（包含所有 ipk 插件，文件很大）
  UPLOAD_FIRMWARE: true                                # 是否上传编译好的固件目录
  UPLOAD_RELEASE: true                                 # 是否将固件发布到 GitHub Release
  TZ: Asia/Shanghai                                    # 设置编译环境的时区为上海

jobs:
  build:
    runs-on: ubuntu-22.04 # 使用 Ubuntu 22.04 官方运行环境

    steps:
    # 1. 拉取你当前仓库的代码（比如你的 config 文件和 diy 脚本）
    - name: 检出当前仓库代码
      uses: actions/checkout@v4 # 【修复】使用稳定的 v4 版本

    # 2. 极其关键的一步：清理 Ubuntu 运行环境，释放大量磁盘空间，并安装所有编译 OpenWrt 所需的依赖项
    - name: 初始化编译环境
      env:
        DEBIAN_FRONTEND: noninteractive # 防止安装过程中弹出交互式对话框卡住流水线
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    # 3. 将 ImmortalWrt 的源码克隆到 /workdir 目录下
    - name: 克隆目标源码
      working-directory: /workdir
      run: |
        df -hT $PWD # 打印当前磁盘空间
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt # 创建软链接方便后续调用

    # 4. 执行第一个自定义脚本（通常用于添加额外的第三方插件源）
    - name: 加载自定义软件源 (diy-part1.sh)
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    # 5. 更新软件源索引
    - name: 更新软件源 (Update feeds)
      run: cd openwrt && ./scripts/feeds update -a

    # 6. 安装软件源中的包到本地环境中
    - name: 安装软件源 (Install feeds)
      run: cd openwrt && ./scripts/feeds install -a

    # 7. 注入你的 .config 文件，并执行第二个自定义脚本（通常用于修改默认 IP、主机名、替换默认主题等）
    - name: 加载自定义配置 (diy-immortalwrt.sh)
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    # 【核心修复 2】8. 开启 tmate SSH 连接，方便在编译前介入容器检查配置（如执行 make menuconfig）
    - name: SSH 连接到 Actions 运行环境
      uses: mxschmitt/action-tmate@v3
      if: (github.event.inputs.ssh == 'true' && github.event.inputs.ssh != 'false') || contains(github.event.action, 'ssh')

    # 9. 预下载所有编译需要用到的依赖包（多线程下载，并在下载后清理小于 1KB 的无效文件）
    - name: 下载编译所需的软件包
      id: package
      run: |
        cd openwrt
        make defconfig
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    # 10. 开始正式编译固件
    - name: 编译固件
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile" # 打印当前可用 CPU 核心数
        # 尝试多线程编译，如果失败则回退到单线程，如果再失败则单线程输出详细日志(V=s)排错
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        # 从配置文件中提取设备名称，用于后续文件命名
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    # 11. 编译完成后打印剩余的磁盘空间
    - name: 检查磁盘空间使用情况
      if: (!cancelled())
      run: df -hT

    # 12. （可选）上传包含所有编译产物的 bin 目录作为 Artifacts
    - name: 上传 bin 目录
      uses: actions/upload-artifact@v4 # 【修复】使用稳定的 v4 版本
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    # 13. 清理不需要的 packages，整理出只有固件的目录
    - name: 整理固件文件
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    # 14. 上传整理好的固件目录作为 Artifacts（供在 Actions 页面直接下载）
    - name: 上传固件目录
      uses: actions/upload-artifact@v4 # 【修复】使用稳定的 v4 版本
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: ImmortalWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    # 15. 根据当前时间生成唯一的 Release 标签名称
    - name: 生成 Release 标签
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo "release_tag=ImmortalWrt-$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        touch release.txt
        echo "status=success" >> $GITHUB_OUTPUT

    # 16. 创建 GitHub Release 并将固件文件作为附件上传
    - name: 将固件发布到 Release
      uses: softprops/action-gh-release@v2 # 【修复】使用稳定的 v2 版本
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        name: 天灵 ImmortalWrt 固件 ${{ steps.tag.outputs.release_tag }}
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*

    # 17. 清理过去的 Actions 运行记录，保持页面整洁
    - name: 删除旧的 workflow 运行记录
      uses: Mattraks/delete-workflow-runs@v2 # 【修复】使用稳定的 v2 版本
      with:
        retain_days: 0
        keep_minimum_runs: 2

    # 【核心修复 3】18. 原生脚本替代高风险的第三方插件：自动清理超过 3 个历史的 Release 及其对应的 Git Tag
    - name: 自动清理旧的 Releases
      uses: actions/github-script@v7 # 【修复】使用稳定的 v7 版本
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const { data: releases } = await github.rest.repos.listReleases({
            owner: context.repo.owner,
            repo: context.repo.repo,
          });
          
          const KEEP_LATEST = 3; // 此处可修改想保留的历史固件数量
          
          if (releases.length > KEEP_LATEST) {
            const toDelete = releases.slice(KEEP_LATEST);
            for (const release of toDelete) {
              console.log(`正在删除旧 Release 记录: ${release.tag_name}`);
              
              try {
                await github.rest.repos.deleteRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: release.id,
                });
                console.log(`成功删除 Release: ${release.tag_name}`);
              } catch (err) {
                console.error(`删除 Release ${release.tag_name} 失败: ${err.message}`);
              }
              
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `tags/${release.tag_name}`,
                });
                console.log(`成功删除 Git Tag: ${release.tag_name}`);
              } catch (error) {
                console.error(`删除 Git Tag ${release.tag_name} 失败: ${error.message}`);
              }
            }
          }
